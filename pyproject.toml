[project]
name = "traffic-generator"
version = "0.1.0"
description = "Générateur de trafic normal pour la boutique Basecamp (entraînement et test du détecteur ML)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "poethepoet>=0.29.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# Outil autonome (comme un service Basecamp) : pas de package à construire.
[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
# importlib : permet les fichiers test_x.unit.py (noms avec points) sans __init__.py dans __tests__/.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
testpaths = ["app"]
python_files = ["test_*.unit.py", "test_*.integ.py"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/**/__init__.py", "app/**/__tests__/**"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S311 : le hasard sert à simuler des visiteurs, jamais à la cryptographie.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"**/__tests__/**" = ["S101", "S105", "S106", "S107"]  # faux jetons et mots de passe de test

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unreachable = true
show_error_codes = true

[tool.poe.tasks.normal]
help = "Génère du trafic normal vers la pile (ex. : uv run poe normal --minutes 5 --sessions-per-minute 6)"
cmd = "python -m app.traffic.presentation.cli"

[tool.poe.tasks.test]
help = "Lance les tests avec couverture (seuil 80 %)"
cmd = "pytest"

[tool.poe.tasks.lint]
help = "Vérifie le style et la sécurité du code (ruff)"
cmd = "ruff check ."

[tool.poe.tasks.format]
help = "Formate le code (ruff format)"
cmd = "ruff format ."

[tool.poe.tasks."format:check"]
help = "Vérifie le formatage sans rien modifier (ruff format --check)"
cmd = "ruff format --check ."

[tool.poe.tasks.typecheck]
help = "Vérifie les types (mypy)"
cmd = "mypy"

[tool.poe.tasks.security]
help = "Audit des dépendances : échoue dès une vulnérabilité connue (pip-audit)"
cmd = "pip-audit --skip-editable"

[tool.poe.tasks.quality]
help = "Lint, formatage et types (bloquant en CI)"
sequence = ["lint", "format:check", "typecheck"]

[tool.poe.tasks.check]
help = "Qualité, audit des dépendances puis tests (ce que la CI exécute)"
sequence = ["quality", "security", "test"]
